resources:
  pipelines:
    pickup_journey:
      name: FE Bar Pharmacy Pickup Journey - ${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: ../src/pipeline
      libraries:
        - glob:
            include: ../src/pipeline/**
      serverless: true
      continuous: false
      development: true
      photon: true
      channel: current
      configuration:
        raw_root: /Volumes/${var.catalog}/${var.schema}/raw_sources
